<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --card: rgba(255,255,255,.05);
    --line: rgba(255,255,255,.12);
    --text: #f2f2f7;
    --muted: #9a9aab;
    --accent: #8b7bff;
    --mx: 50%;
    --my: 30%;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Space Grotesk", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
    padding: 24px;
    overflow-x: hidden;
  }
  /* Glow that follows the cursor: the one memorable detail */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(420px circle at var(--mx) var(--my), rgba(139,123,255,.22), transparent 70%);
    pointer-events: none;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    padding: 36px 28px 28px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .avatar {
    width: 104px; height: 104px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
    background: #1b1b26;
  }
  h1 { margin: 16px 0 4px; font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; }
  .bio { margin: 0 auto 4px; max-width: 32ch; color: var(--muted); line-height: 1.5; }
  .loc { margin: 0 0 24px; color: var(--muted); font-size: .9rem; }
  .links { display: grid; gap: 10px; }
  .links a {
    display: block;
    padding: 13px 16px;
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(255,255,255,.03);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .links a:hover, .links a:focus-visible {
    border-color: var(--accent);
    background: rgba(139,123,255,.12);
    transform: translateY(-1px);
    outline: none;
  }
  .links a:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .links a { transition: none; }
    .links a:hover { transform: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="avatar.png" alt="s" onerror="this.style.visibility='hidden'">
    <h1>boyke</h1>
    <p class="bio">aspiring blueteamer</p>
    <p class="loc">duketown gmt+1</p>

    <nav class="links" aria-label="Links">

      <a href="mailto:juanfarquaad@protonmail.ch">email</a>
    </nav>
  </main>

<audio id="bgm" src="LEGOSHI.mp3" loop></audio>
<script>
  const audio = document.getElementById('bgm');
  audio.volume = 0.3;

  const DELAY = 500; // milliseconds

  function startMusic() {
    setTimeout(() => audio.play(), DELAY);
  }
  
  const audio = document.getElementById('bgm');
  audio.volume = 0.3;
  audio.play().catch(() => {
    const start = () => {
      audio.play();
      removeEventListener('pointerdown', start);
      removeEventListener('keydown', start);
    };
    addEventListener('pointerdown', start);
    addEventListener('keydown', start);
  }, DELAY);
</script>

  
  <script>
    // Move the glow with the pointer
    addEventListener("pointermove", function (e) {
      document.body.style.setProperty("--mx", e.clientX + "px");
      document.body.style.setProperty("--my", e.clientY + "px");
    });
  </script>
</body>
